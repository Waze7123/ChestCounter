<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortify — Plataforma</title>
<style>
  :root{--bg:#0b0f1a;--bg2:#111726;--card:#151d30;--line:#223049;--txt:#e7ecf5;--muted:#9aa7bd;--accent:#3ddc97;--accent2:#4a8dff;--danger:#ff6b6b;--radius:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  a{color:var(--accent);cursor:pointer}
  .wrap{max-width:900px;margin:0 auto;padding:24px 20px}
  .center{max-width:440px}
  h1{font-size:22px;display:flex;align-items:center;gap:10px}
  .dot{width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .muted{color:var(--muted);font-size:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-top:18px}
  .field{margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--txt);font-size:14px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{background:var(--accent);color:#05231a;font-weight:700;border:none;padding:12px 22px;border-radius:999px;font-size:15px;cursor:pointer;transition:transform .12s}
  .btn:hover{transform:translateY(-1px)}
  .btn.full{width:100%}
  .btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .btn.sm{padding:8px 16px;font-size:13px}
  .topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}
  .topbar nav{display:flex;gap:16px;align-items:center;font-size:14px}
  .hidden{display:none!important}
  .steps{display:flex;gap:8px;margin:20px 0}
  .steps .s{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .steps .s.on{background:var(--accent)}
  .token{background:var(--bg2);border:1px dashed var(--accent);border-radius:9px;padding:12px;font-family:monospace;font-size:13px;word-break:break-all;color:var(--accent);margin:8px 0}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
  .tab.on{border-color:var(--accent);color:var(--txt)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.ok{background:rgba(61,220,151,.15);color:var(--accent)}
  .badge.wait{background:rgba(255,200,80,.15);color:#ffc850}
  canvas{background:#fff;border-radius:9px;touch-action:none;width:100%;height:180px;display:block}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .err{color:var(--danger);font-size:13px;margin-top:8px}
  .ok{color:var(--accent);font-size:13px;margin-top:8px}
  .info{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:13px;color:var(--muted);margin:10px 0}
  /* contract preview */
  #contractDoc{background:#fff;color:#1a1a1a;border-radius:9px;padding:30px;font-size:12.5px;line-height:1.55;max-height:340px;overflow:auto}
  #contractDoc h4{font-size:15px;text-align:center;margin-bottom:10px}
  #contractDoc h5{font-size:13px;margin:12px 0 4px;border-bottom:1px solid #eee}
  #contractDoc .sig{height:60px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const $ = s => document.querySelector(s);
const DB = {
  users(){return JSON.parse(localStorage.getItem('fortify_users')||'[]')},
  saveUsers(u){localStorage.setItem('fortify_users',JSON.stringify(u))},
  contracts(){return JSON.parse(localStorage.getItem('fortify_contracts')||'[]')},
  saveContracts(c){localStorage.setItem('fortify_contracts',JSON.stringify(c))},
  session(){return JSON.parse(localStorage.getItem('fortify_session')||'null')},
  setSession(s){localStorage.setItem('fortify_session',JSON.stringify(s))}
};
let draft = {};      // dados em construção
let sigPad = null;   // instância assinatura

function token(){return 'fortify-verify-'+Math.random().toString(36).slice(2,10)}
function uid(){return 'C'+Date.now().toString(36).toUpperCase()}

/* ---------- ROUTING ---------- */
function go(view){ render(view); }
function render(view){
  const s = DB.session();
  if(!view) view = s ? (s.admin?'admin':'dash') : 'auth';
  const app = $('#app');
  if(view==='auth') return app.innerHTML = viewAuth();
  if(!s){ return app.innerHTML = viewAuth(); }
  if(view==='dash') { app.innerHTML = viewDash(); return; }
  if(view==='admin'){ app.innerHTML = viewAdmin(); return; }
  if(view==='onboard'){ app.innerHTML = viewOnboard(); bindOnboard(); return; }
  if(view==='verify'){ app.innerHTML = viewVerify(); return; }
  if(view==='sign'){ app.innerHTML = viewSign(); initSig(); renderContract(); return; }
}

/* ---------- AUTH ---------- */
function viewAuth(){
  return `<div class="center" style="margin:60px auto 0">
    <h1><span class="dot"></span> Fortify</h1>
    <p class="muted" style="margin-top:6px">Cria a tua conta grátis e começa a proteger o teu site.</p>
    <div class="panel">
      <div class="tabs">
        <div class="tab on" id="tabReg" onclick="switchAuth('reg')">Criar conta</div>
        <div class="tab" id="tabLog" onclick="switchAuth('log')">Entrar</div>
      </div>
      <div id="regForm">
        <div class="field"><label>Nome</label><input id="r_name" placeholder="O teu nome"></div>
        <div class="field"><label>Email</label><input id="r_email" type="email" placeholder="email@empresa.pt"></div>
        <div class="field"><label>Palavra-passe</label><input id="r_pass" type="password"></div>
        <button class="btn full" onclick="register()">Criar conta grátis</button>
        <div class="err hidden" id="regErr"></div>
      </div>
      <div id="logForm" class="hidden">
        <div class="field"><label>Email</label><input id="l_email" type="email"></div>
        <div class="field"><label>Palavra-passe</label><input id="l_pass" type="password"></div>
        <button class="btn full" onclick="login()">Entrar</button>
        <div class="err hidden" id="logErr"></div>
      </div>
    </div>
    <p class="note" style="text-align:center">Protótipo — dados guardados só neste navegador. · <a onclick="adminLogin()">Área Admin (dono)</a></p>
  </div>`;
}
function switchAuth(t){
  $('#tabReg').classList.toggle('on',t==='reg');$('#tabLog').classList.toggle('on',t==='log');
  $('#regForm').classList.toggle('hidden',t!=='reg');$('#logForm').classList.toggle('hidden',t!=='log');
}
function register(){
  const name=$('#r_name').value.trim(), email=$('#r_email').value.trim().toLowerCase(), pass=$('#r_pass').value;
  if(!name||!email||!pass) return showErr('regErr','Preenche todos os campos.');
  let users=DB.users();
  if(users.find(u=>u.email===email)) return showErr('regErr','Já existe conta com este email.');
  users.push({name,email,pass}); DB.saveUsers(users);
  DB.setSession({name,email,admin:false}); go('dash');
}
function login(){
  const email=$('#l_email').value.trim().toLowerCase(), pass=$('#l_pass').value;
  const u=DB.users().find(u=>u.email===email&&u.pass===pass);
  if(!u) return showErr('logErr','Email ou palavra-passe errados.');
  DB.setSession({name:u.name,email:u.email,admin:false}); go('dash');
}
function adminLogin(){ DB.setSession({name:'Admin Fortify',email:'admin',admin:true}); go('admin'); }
function logout(){ localStorage.removeItem('fortify_session'); go('auth'); }
function showErr(id,msg){const e=$('#'+id);e.textContent=msg;e.classList.remove('hidden');}

/* ---------- CLIENT DASHBOARD ---------- */
function topbar(extra=''){
  const s=DB.session();
  return `<div class="topbar"><h1><span class="dot"></span> Fortify</h1>
    <nav><span class="muted">${s.name}</span>${extra}<a onclick="logout()">Sair</a></nav></div>`;
}
function viewDash(){
  const s=DB.session();
  const mine=DB.contracts().filter(c=>c.userEmail===s.email);
  const rows = mine.length ? mine.map(c=>`<tr><td>${c.id}</td><td>${c.empresa||'—'}</td><td>${c.site||'—'}</td>
     <td><span class="badge ${c.verified?'ok':'wait'}">${c.verified?'Site verificado':'Não verificado'}</span></td>
     <td>${c.signed?'<span class="badge ok">Assinado</span>':'<span class="badge wait">Pendente</span>'}</td>
     <td>${new Date(c.date).toLocaleDateString('pt-PT')}</td></tr>`).join('')
     : `<tr><td colspan="6" class="muted">Ainda não tens contratos. Começa um novo!</td></tr>`;
  return topbar() + `
   <div class="panel" style="display:flex;justify-content:space-between;align-items:center">
     <div><h2 style="font-size:18px">Os teus contratos</h2><p class="muted">Autoriza a análise de segurança do teu site.</p></div>
     <button class="btn" onclick="startDraft()">+ Novo contrato</button>
   </div>
   <div class="panel"><table>
     <tr><th>Ref</th><th>Empresa</th><th>Site</th><th>Verificação</th><th>Assinatura</th><th>Data</th></tr>
     ${rows}
   </table></div>`;
}
function startDraft(){ draft={}; go('onboard'); }

/* ---------- ONBOARDING ---------- */
function viewOnboard(){
  return topbar() + `
   <div class="steps"><div class="s on"></div><div class="s"></div><div class="s"></div></div>
   <div class="panel">
     <h2 style="font-size:18px">1. Dados da empresa</h2>
     <p class="muted" style="margin-bottom:14px">Preenche os dados de quem autoriza a auditoria.</p>
     <div class="field"><label>Nome da empresa</label><input id="o_empresa" value="${draft.empresa||''}"></div>
     <div class="row">
       <div class="field"><label>NIF</label><input id="o_nif" value="${draft.nif||''}"></div>
       <div class="field"><label>Representante (teu nome)</label><input id="o_rep" value="${draft.rep||''}"></div>
     </div>
     <div class="field"><label>Website a analisar</label><input id="o_site" placeholder="https://..." value="${draft.site||''}"></div>
     <div class="field"><label>Email / Telefone de contacto</label><input id="o_contacto" value="${draft.contacto||''}"></div>
     <div class="info">☑️ Ao avançar, declaras que és o dono do site/empresa ou que tens autoridade para autorizar a análise.</div>
     <div class="field"><label><input type="checkbox" id="o_decl" style="width:auto"> Confirmo que tenho autoridade para autorizar.</label></div>
     <div style="display:flex;gap:10px;margin-top:6px">
       <button class="btn sec sm" onclick="go('dash')">Cancelar</button>
       <button class="btn" onclick="saveOnboard()">Continuar →</button>
     </div>
     <div class="err hidden" id="obErr"></div>
   </div>`;
}
function bindOnboard(){}
function saveOnboard(){
  draft.empresa=$('#o_empresa').value.trim(); draft.nif=$('#o_nif').value.trim();
  draft.rep=$('#o_rep').value.trim(); draft.site=$('#o_site').value.trim(); draft.contacto=$('#o_contacto').value.trim();
  if(!draft.empresa||!draft.site||!draft.rep) return showErr('obErr','Preenche empresa, website e representante.');
  if(!$('#o_decl').checked) return showErr('obErr','Tens de confirmar a autoridade para autorizar.');
  if(!draft.vtoken) draft.vtoken = token();
  go('verify');
}

/* ---------- VERIFICATION ---------- */
function viewVerify(){
  let host='o-teu-site.pt'; try{ host=new URL(draft.site.startsWith('http')?draft.site:'https://'+draft.site).hostname; }catch(e){}
  return topbar() + `
   <div class="steps"><div class="s on"></div><div class="s on"></div><div class="s"></div></div>
   <div class="panel">
     <h2 style="font-size:18px">2. Prova que o site é teu</h2>
     <p class="muted" style="margin-bottom:12px">Escolhe um método. Isto confirma que controlas <b>${host}</b> — é o que torna a análise legítima.</p>
     <div class="tabs">
       <div class="tab on" id="mDns" onclick="vmethod('dns')">Registo DNS</div>
       <div class="tab" id="mFile" onclick="vmethod('file')">Ficheiro no servidor</div>
     </div>
     <div id="vDns">
       <p class="muted">Adiciona este registo <b>TXT</b> no DNS do domínio <b>${host}</b>:</p>
       <div class="token">TXT &nbsp; @ &nbsp; "${draft.vtoken}"</div>
       <p class="note">No teu fornecedor de domínio (ex: GoDaddy, PTisp), vai a Gestão de DNS → Adicionar registo TXT.</p>
     </div>
     <div id="vFile" class="hidden">
       <p class="muted">Cria um ficheiro com este nome na raiz do site, acessível em:</p>
       <div class="token">https://${host}/${draft.vtoken}.txt</div>
       <p class="note">O conteúdo do ficheiro pode ser o próprio código.</p>
     </div>
     <div class="info">🔎 Na versão final, o sistema verifica isto automaticamente. Neste protótipo, clica para simular a verificação.</div>
     <div style="display:flex;gap:10px">
       <button class="btn sec sm" onclick="go('onboard')">← Voltar</button>
       <button class="btn" onclick="doVerify()">Verificar posse</button>
     </div>
     <div class="ok hidden" id="vOk">✓ Posse confirmada! A redirecionar para o contrato…</div>
   </div>`;
}
function vmethod(m){
  $('#mDns').classList.toggle('on',m==='dns');$('#mFile').classList.toggle('on',m==='file');
  $('#vDns').classList.toggle('hidden',m!=='dns');$('#vFile').classList.toggle('hidden',m!=='file');
}
function doVerify(){
  draft.verified=true; $('#vOk').classList.remove('hidden');
  setTimeout(()=>go('sign'),1100);
}

/* ---------- SIGN / CONTRACT ---------- */
function viewSign(){
  return topbar() + `
   <div class="steps"><div class="s on"></div><div class="s on"></div><div class="s on"></div></div>
   <div class="panel">
     <h2 style="font-size:18px">3. Rever e assinar</h2>
     <p class="muted" style="margin-bottom:12px">Lê o contrato e assina em baixo (com o rato ou o dedo).</p>
     <div id="contractDoc"></div>
     <div style="margin-top:16px">
       <label>A tua assinatura</label>
       <canvas id="sig"></canvas>
       <div style="display:flex;gap:10px;margin-top:8px">
         <button class="btn sec sm" onclick="clearSig()">Limpar assinatura</button>
       </div>
     </div>
     <div style="display:flex;gap:10px;margin-top:18px">
       <button class="btn sec sm" onclick="go('verify')">← Voltar</button>
       <button class="btn" onclick="submitContract()">Assinar e enviar contrato</button>
     </div>
     <div class="err hidden" id="sgErr"></div>
   </div>`;
}
function renderContract(){
  const s=DB.session(); const d=new Date().toLocaleDateString('pt-PT');
  $('#contractDoc').innerHTML = `
    <h4>CONTRATO DE AUTORIZAÇÃO PARA TESTES DE SEGURANÇA</h4>
    <h5>Partes</h5>
    <p><b>Prestador:</b> Fortify — Auditoria de Segurança</p>
    <p><b>Cliente:</b> ${draft.empresa||'—'} — NIF ${draft.nif||'—'} · Representante: ${draft.rep||'—'} · ${draft.contacto||''}</p>
    <h5>Objeto</h5>
    <p>O Cliente autoriza o Prestador a realizar uma análise de segurança ao website <b>${draft.site}</b>, cuja posse foi verificada. A análise cobre o OWASP Top 10, configuração e exposição de dados, excluindo ataques de negação de serviço e qualquer ação destrutiva.</p>
    <h5>Confidencialidade e RGPD</h5>
    <p>As vulnerabilidades encontradas são confidenciais e entregues apenas ao Cliente. Ambas as partes cumprem o RGPD. O Cliente pode revogar esta autorização por escrito a qualquer momento.</p>
    <h5>Declaração</h5>
    <p>O Cliente declara ser o legítimo titular ou ter autoridade para autorizar esta análise. Aplica-se a lei portuguesa.</p>
    <p style="margin-top:10px">Data: ${d} · Posse do site: <b>verificada</b></p>
  `;
}
function initSig(){
  const c=$('#sig'); const r=c.getBoundingClientRect();
  c.width=r.width*2; c.height=r.height*2; const ctx=c.getContext('2d'); ctx.scale(2,2);
  ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  let drawing=false, empty=true;
  const pos=e=>{const b=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-b.left,y:t.clientY-b.top}};
  const start=e=>{drawing=true;empty=false;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};
  const end=()=>{drawing=false};
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start);c.addEventListener('touchmove',move);c.addEventListener('touchend',end);
  sigPad={canvas:c,isEmpty:()=>empty,clear:()=>{ctx.clearRect(0,0,c.width,c.height);empty=true},data:()=>c.toDataURL()};
}
function clearSig(){ if(sigPad) sigPad.clear(); }
function submitContract(){
  if(!sigPad||sigPad.isEmpty()) return showErr('sgErr','Assina no quadro antes de enviar.');
  const s=DB.session();
  const c={ id:uid(), userEmail:s.email, userName:s.name,
    empresa:draft.empresa, nif:draft.nif, rep:draft.rep, site:draft.site, contacto:draft.contacto,
    verified:true, signed:true, signature:sigPad.data(), date:Date.now() };
  const all=DB.contracts(); all.push(c); DB.saveContracts(all);
  draft={}; alert('✓ Contrato assinado e enviado! Já aparece no teu painel e no dashboard do admin.'); go('dash');
}

/* ---------- ADMIN DASHBOARD ---------- */
function viewAdmin(){
  const all=DB.contracts().slice().reverse();
  const stats={total:all.length, signed:all.filter(c=>c.signed).length, verified:all.filter(c=>c.verified).length};
  const rows = all.length ? all.map(c=>`<tr>
     <td>${c.id}</td><td>${c.empresa}<br><span class="muted" style="font-size:12px">${c.userName} · ${c.userEmail}</span></td>
     <td>${c.site}</td><td>${c.nif||'—'}</td>
     <td>${c.verified?'<span class="badge ok">✓</span>':'<span class="badge wait">—</span>'}</td>
     <td>${c.signature?`<img src="${c.signature}" style="height:34px;background:#fff;border-radius:4px">`:'—'}</td>
     <td>${new Date(c.date).toLocaleString('pt-PT')}</td></tr>`).join('')
     : `<tr><td colspan="7" class="muted">Ainda não há contratos submetidos.</td></tr>`;
  return topbar('<span class="badge ok">ADMIN</span>') + `
   <div class="panel" style="display:flex;gap:24px">
     <div><div style="font-size:26px;font-weight:800">${stats.total}</div><div class="muted">Contratos</div></div>
     <div><div style="font-size:26px;font-weight:800;color:var(--accent)">${stats.signed}</div><div class="muted">Assinados</div></div>
     <div><div style="font-size:26px;font-weight:800;color:var(--accent2)">${stats.verified}</div><div class="muted">Sites verificados</div></div>
   </div>
   <div class="panel">
     <h2 style="font-size:18px">Contratos recebidos</h2>
     <table>
       <tr><th>Ref</th><th>Cliente</th><th>Site</th><th>NIF</th><th>Posse</th><th>Assinatura</th><th>Data</th></tr>
       ${rows}
     </table>
   </div>`;
}

render();
</script>
</body>
</html>
